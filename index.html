<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JAS Labs — Engineering studio for data-heavy software</title>
  <meta name="description"
    content="JAS Labs is a small engineering studio building geospatial platforms, cross-platform apps and applied NLP systems — from schema design to production deploy." />
  <meta name="theme-color" content="#ffffff" />
  <script>
    try {
      const theme = localStorage.getItem('jas-labs-theme') === 'dark' ? 'dark' : 'light';
      document.documentElement.dataset.theme = theme;
      document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#07080a' : '#ffffff';
    } catch {
      document.documentElement.dataset.theme = 'light';
    }
  </script>
  <!-- Google Search Console ownership verification — do not remove -->
  <meta name="google-site-verification" content="vQAbd45xYGk0juHilC0Ehz4oMsUwsj9gEkU1ugodvfw" />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="JAS Labs — Engineering studio for data-heavy software" />
  <meta property="og:description"
    content="Geospatial platforms, cross-platform apps and applied NLP systems. A three-person studio in Dhaka, working worldwide." />
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%2307080A'/><path d='M8 10.5l4.5 5.5L8 21.5' stroke='%23C6F24E' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/><path d='M15.5 21.5H24' stroke='%23C6F24E' stroke-width='2.6' stroke-linecap='round'/></svg>" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            display: ['"Inter Tight"', 'system-ui', 'sans-serif'],
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace'],
          },
          colors: {
            ink: {
              ...Object.fromEntries([950, 900, 850, 800, 700, 600, 500, 400, 300, 200, 100, 50]
                .map(shade => [shade, `rgb(var(--ink-${shade}) / <alpha-value>)`])),
            },
            acid: {
              ...Object.fromEntries([300, 400, 500, 600, 700]
                .map(shade => [shade, `rgb(var(--acid-${shade}) / <alpha-value>)`])),
            },
          },
          maxWidth: {
            container: '80rem',
          },
          keyframes: {
            marquee: {
              '0%': { transform: 'translateX(0)' },
              '100%': { transform: 'translateX(-50%)' },
            },
            blink: {
              '0%, 49%': { opacity: '1' },
              '50%, 100%': { opacity: '0' },
            },
            sweep: {
              '0%': { transform: 'translateY(-100%)' },
              '100%': { transform: 'translateY(400%)' },
            },
          },
          animation: {
            marquee: 'marquee 42s linear infinite',
            blink: 'blink 1.1s step-end infinite',
            sweep: 'sweep 5.5s ease-in-out infinite',
          },
        },
      },
    }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
